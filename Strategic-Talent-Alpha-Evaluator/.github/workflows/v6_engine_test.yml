name: V6.0 Core Engine Auto-Test

# 触发条件：当你把代码 push 到 GitHub 时自动运行
on:
  push:
    branches: [ "main", "master" ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest # 使用 GitHub 免费提供的极其稳定的 Linux 云服务器

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v3

    - name: 🐍 配置 Python 3.10 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 安装核心依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 点火测试：运行 V6.0 引擎
      run: |
        python main.py